version: '3.8'

services:
  api:
    build:
      context: ./url-shortener
      dockerfile: Dockerfile
    container_name: linkpilot-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
    depends_on:
      - postgres
      - redis
    env_file:
      - ./url-shortener/.env

  frontend:
    build:
      context: ./linkpilot-frontend
      dockerfile: Dockerfile
    container_name: linkpilot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  postgres:
    image: postgres:17
    container_name: url-shortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    command: redis-server
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
